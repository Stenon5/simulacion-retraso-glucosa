# Pre-specified pass and fail criteria.
#
# Committed before the code that checks them exists.
#
# Disclosure: these criteria were chosen after an earlier exploratory run
# on 2026-10-16 whose scripts are not in this repository. They are fixed
# before the reproduction that this repository performs, not before the
# idea was first tried. Read them as the specification of a replication,
# not as a blind preregistration.
#
# This file is not edited after a result has been seen. If a criterion turns
# out to be wrong or badly posed, the amendment goes in a NEW file named
# thresholds-amendment-<YYYY-MM-DD>.yaml that states what changed and why, and
# both files stay in the repository. Editing this one in place would make
# every later claim unfalsifiable.

meta:
  version: 1
  committed: "2026-10-22"
  applies_to: synthetic data generated by the model in docs/spec.md
  status: no results yet

reporting_rules:
  - id: bias_with_spread
    rule: >-
      Every bias is reported together with the standard deviation across seeds,
      for each scenario separately. A bias averaged over scenarios is never
      reported on its own, because a small average can hide a much larger
      spread between scenarios.
  - id: per_scenario
    rule: >-
      Pass or fail is decided per scenario. A global pass is only claimed when
      every scenario in the grid passes, and the scenarios that failed are
      named either way.
  - id: counts_not_only_rates
    rule: >-
      Counts are reported with their denominator. A rate never appears without
      the count it came from.
  - id: seeds_fixed
    rule: >-
      Every reported number comes with the seed and the configuration that
      produced it, and a rerun with that seed reproduces it.

criteria:
  - id: delay_bias
    statement: >-
      The mean bias of each estimated time constant is below 1 minute in every
      scenario, and the standard deviation across seeds is reported next to it.
    passes_if: mean absolute bias < 1 minute per scenario
    note: >-
      Meeting the bias while the spread is several times larger is reported as
      a fail of the spirit of this criterion, and the spread is shown.

  - id: noise_requirement
    statement: >-
      The noise level per reading at which the method still beats the single
      depth baseline is identified, and it is at most 3 mg/dL.
    passes_if: the crossover noise level is at or above 3 mg/dL per reading
    note: >-
      If the crossover sits below this, the honest conclusion is that the
      hardware, not the algorithm, is the limit. That is a result and it gets
      published as one.

  - id: earlier_alarm
    statement: >-
      The hypoglycemia alarm fires earlier with two depths and an estimated
      delay than with a single smoothed depth, in every scenario.
    passes_if: alarm time earlier in every scenario, with the per scenario spread shown
    note: >-
      Firing earlier is only useful if it does not fire more often when it
      should not, so the false alarm count is reported alongside and an
      increase is treated as a fail.

  - id: beats_fixed_population_delay
    statement: >-
      Estimating the delay beats assuming a fixed population delay.
    passes_if: lower error than the fixed delay baseline in every scenario
    note: >-
      This is the baseline a device would fall back to, so losing to it would
      make the estimator pointless.

  - id: noise_estimate_recovers
    statement: >-
      The noise level estimated from the signal matches the noise that was
      injected.
    passes_if: estimated noise within 10 percent of injected noise per scenario

stopping_rules:
  - id: identifiability
    rule: >-
      If the corrected design matrix is near singular for a scenario, that
      scenario is reported as not identifiable instead of reporting whatever
      number comes out of the inversion.
  - id: negative_time_constant
    rule: >-
      A negative estimated time constant is a failure, not a datapoint. The run
      reports it as a failure and does not clip it to zero.

out_of_scope:
  - Any claim about accuracy in a person.
  - Any claim about a device.
  - Any comparison against a commercial product.
