[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulacion-retraso-glucosa"
version = "0.0.0"
description = "Estudio de simulación sobre cómo estimar el retraso de la glucosa entre la sangre y el tejido con dos profundidades ópticas. Andamiaje, todavía sin resultados. No es un dispositivo médico."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Stenon5" }]
keywords = ["simulación", "estimación de estado", "filtro de Kalman", "reproducibilidad"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Stenon5/simulacion-retraso-glucosa"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["ARG001"]
